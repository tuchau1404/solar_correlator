<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 470" width="100%" height="100%" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Mũi tên xám đậm (fork) -->
    <marker id="arr-gray" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 2 L 7 5 L 1 8 z" fill="#475569" />
    </marker>
    <!-- Mũi tên xanh dương (write) -->
    <marker id="arr-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 2 L 7 5 L 1 8 z" fill="#2563EB" />
    </marker>
    <!-- Mũi tên xanh ngọc (read / mmap) -->
    <marker id="arr-teal" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 2 L 7 5 L 1 8 z" fill="#0D9488" />
    </marker>
  </defs>

  <!-- ================= 1. TIẾN TRÌNH CHA (PARENT MASTER PROCESS) ================= -->
  <rect x="230" y="20" width="380" height="76" rx="10" fill="#F8FAFC" stroke="#334155" stroke-width="2" />
  <rect x="245" y="30" width="130" height="18" rx="3" fill="#334155" />
  <text x="310" y="43" fill="#FFFFFF" font-size="10" font-weight="700" letter-spacing="0.5" text-anchor="middle">PARENT PROCESS</text>
  <text x="420" y="62" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle">Parent Master Process</text>
  <text x="420" y="80" font-size="11.5" font-weight="600" fill="#475569" text-anchor="middle">(Lifecycle, Time Alignment &amp; FX DSP Consumer)</text>

  <!-- ================= 2. ĐƯỜNG ĐIỀU PHỐI FORK() ================= -->
  <!-- Rẽ nhánh fork sang Con 1 -->
  <path d="M 320 96 L 320 135 L 195 135 L 195 168" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arr-gray)" />
  <rect x="225" y="123" width="65" height="22" rx="4" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1" />
  <text x="257.5" y="138" font-size="11" font-weight="700" fill="#334155" text-anchor="middle">fork()</text>

  <!-- Rẽ nhánh fork sang Con 2 -->
  <path d="M 520 96 L 520 135 L 645 135 L 645 168" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arr-gray)" />
  <rect x="550" y="123" width="65" height="22" rx="4" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1" />
  <text x="582.5" y="138" font-size="11" font-weight="700" fill="#334155" text-anchor="middle">fork()</text>

  <!-- ================= 3. CÁC TIẾN TRÌNH CON (CHILD PRODUCERS) ================= -->
  <!-- Child Producer 1 -->
  <rect x="65" y="170" width="260" height="74" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2" />
  <text x="195" y="196" font-size="13.5" font-weight="700" fill="#1E40AF" text-anchor="middle">Child Producer 1 (PID 1)</text>
  <text x="195" y="215" font-size="11.5" font-weight="600" fill="#2563EB" text-anchor="middle">sdrplay Device 0 (Serial A)</text>
  <text x="195" y="231" font-size="10.5" fill="#64748B" text-anchor="middle">10.0 MSPS Streaming Callback</text>

  <!-- Child Producer 2 -->
  <rect x="515" y="170" width="260" height="74" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2" />
  <text x="645" y="196" font-size="13.5" font-weight="700" fill="#1E40AF" text-anchor="middle">Child Producer 2 (PID 2)</text>
  <text x="645" y="215" font-size="11.5" font-weight="600" fill="#2563EB" text-anchor="middle">sdrplay Device 1 (Serial B)</text>
  <text x="645" y="231" font-size="10.5" fill="#64748B" text-anchor="middle">10.0 MSPS Streaming Callback</text>

  <!-- ================= 4. ĐƯỜNG GHI DỮ LIỆU WRITE() ================= -->
  <!-- Write Ch1 -->
  <line x1="195" y1="244" x2="195" y2="308" stroke="#2563EB" stroke-width="2" marker-end="url(#arr-blue)" />
  <rect x="135" y="264" width="120" height="22" rx="4" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1" />
  <text x="195" y="279" font-size="11" font-weight="700" fill="#1E40AF" text-anchor="middle">write() [Zero-Copy]</text>

  <!-- Write Ch2 -->
  <line x1="645" y1="244" x2="645" y2="308" stroke="#2563EB" stroke-width="2" marker-end="url(#arr-blue)" />
  <rect x="585" y="264" width="120" height="22" rx="4" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1" />
  <text x="645" y="279" font-size="11" font-weight="700" fill="#1E40AF" text-anchor="middle">write() [Zero-Copy]</text>

  <!-- ================= 5. VÙNG NHỚ CHIA SẺ (POSIX SHARED MEMORY) ================= -->
  <!-- Shared Memory CH1 -->
  <rect x="50" y="310" width="290" height="84" rx="10" fill="#CCFBF1" stroke="#0D9488" stroke-width="2" />
  <text x="195" y="336" font-size="13" font-weight="700" fill="#115E59" text-anchor="middle">/shm_sdr_ch1 (RAM / tmpfs)</text>
  <text x="195" y="355" font-size="11.5" font-weight="600" fill="#0F766E" text-anchor="middle">Lock-free SPSC Ring Buffer</text>
  <text x="195" y="373" font-size="10.5" fill="#134E4A" text-anchor="middle">Capacity: 2²² complex samples (~16.8 MB)</text>

  <!-- Shared Memory CH2 -->
  <rect x="500" y="310" width="290" height="84" rx="10" fill="#CCFBF1" stroke="#0D9488" stroke-width="2" />
  <text x="645" y="336" font-size="13" font-weight="700" fill="#115E59" text-anchor="middle">/shm_sdr_ch2 (RAM / tmpfs)</text>
  <text x="645" y="355" font-size="11.5" font-weight="600" fill="#0F766E" text-anchor="middle">Lock-free SPSC Ring Buffer</text>
  <text x="645" y="373" font-size="10.5" fill="#134E4A" text-anchor="middle">Capacity: 2²² complex samples (~16.8 MB)</text>

  <!-- ================= 6. VÒNG HỒI TIẾP TIÊU THỤ (CONSUMER MMAP / READ) ================= -->
  <!-- Feedback Ch1 -> Parent -->
  <path d="M 50 352 L 25 352 L 25 58 L 220 58" fill="none" stroke="#0D9488" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arr-teal)" />
  <rect x="5" y="195" width="40" height="66" rx="4" fill="#F0FDFA" stroke="#99F6E4" stroke-width="1" />
  <text x="25" y="215" font-size="10" font-weight="700" fill="#115E59" text-anchor="middle">mmap()</text>
  <text x="25" y="231" font-size="10" font-weight="700" fill="#115E59" text-anchor="middle">&amp;</text>
  <text x="25" y="247" font-size="10" font-weight="700" fill="#115E59" text-anchor="middle">read()</text>

  <!-- Feedback Ch2 -> Parent -->
  <path d="M 790 352 L 815 352 L 815 58 L 620 58" fill="none" stroke="#0D9488" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arr-teal)" />
  <rect x="795" y="195" width="40" height="66" rx="4" fill="#F0FDFA" stroke="#99F6E4" stroke-width="1" />
  <text x="815" y="215" font-size="10" font-weight="700" fill="#115E59" text-anchor="middle">mmap()</text>
  <text x="815" y="231" font-size="10" font-weight="700" fill="#115E59" text-anchor="middle">&amp;</text>
  <text x="815" y="247" font-size="10" font-weight="700" fill="#115E59" text-anchor="middle">read()</text>
</svg>
