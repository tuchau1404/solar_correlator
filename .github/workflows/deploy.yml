name: Deploy Documentation

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: 3.x

      - name: Install MkDocs Material
        run: pip install mkdocs-material

      # Tự động chạy script dọn dẹp và đồng bộ trước khi dựng trang web
      - name: Auto-format documentation & sync README
        run: python format_docs.py

      - name: Deploy to GitHub Pages
        run: mkdocs gh-deploy --force